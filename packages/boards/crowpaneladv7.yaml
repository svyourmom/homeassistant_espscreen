# ESP Screens - Elecrow CrowPanel Advance 7-inch ESP32-S3 (DIS08070H, 800 x 480), EXPERIMENTAL.
# ESP32-S3-WROOM-1-N16R8 (16 MB flash, 8 MB octal PSRAM), 800 x 480 RGB panel, GT911 capacitive touch and an I2C
# board controller (STC8H1K28 at 0x30 on V1.2+, PCA9557 at 0x18 on V1.0-V1.1) for the backlight and touch reset.
# Not the Basic 7-inch (4 MB flash, GPIO backlight). See docs/CROWPANELADV7.md.
# The standard look at 133 dpi, the density of the 7-inch Waveshare and Sunton: 4 x 4 landscape, 2 x 7 portrait.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together, docs/ADDING_A_BOARD.md how a board
# is added. Two entry files include this one: checkout/crowpaneladv7.yaml (a build on this computer) and
# packages/crowpaneladv7.yaml (the package a screen builds from over GitHub).
packages:
  hardware: !include ../hardware/crowpanel-advance-s3.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "crowpaneladv7"
  DEVICE_NAME: "crowpaneladv7-new"
  DEVICE_FRIENDLY_NAME: "My CrowPanel 7"

  # The glass: the panel's own pixels and its density, 933 diagonal pixels over 7.0 inches.
  PANEL_W: "800"
  PANEL_H: "480"
  DISPLAY_DPI: "133.279"
  # The tile grid: columns and rows of cells lying down, and standing up.
  GRID_COLS: "4"
  GRID_ROWS: "4"
  GRID_COLS_PORTRAIT: "2"
  GRID_ROWS_PORTRAIT: "7"
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): the tile list, the cards and the
  # extras live in PSRAM here, and the memory budget (tile_memory.h) says how many of them a layout really takes.
  SCREEN_MAX_TILES: "128"
  SCREEN_MAX_PAGES: "24"
  SCREEN_MAX_BAR_ITEMS: "12"                   # a wider top bar where the glass has the width for it
  # LVGL's draw buffer as a share of the screen: 12 % of 800 x 480, as on the other 800 x 480 boards
  # (docs/ADDING_A_BOARD.md, step 3).
  LVGL_BUFFER_SIZE: "12%"

  # Set by hand when the home key came (firmware 0.2.100); the look would give 27, as on the 7-inch Waveshare
  FONT_ICON_HOME_SIZE: "26"

